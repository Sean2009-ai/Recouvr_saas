<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recouvr — Inscription</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #07080A; font-family: 'Segoe UI', sans-serif; color: #E8E2D4;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1A1200 0%, #07080A 70%);
    }
    .card {
      background: #12151B; border: 1px solid #2C3347; border-radius: 20px;
      padding: 40px 36px; width: 100%; max-width: 420px;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
    }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .logo-icon {
      width: 42px; height: 42px; border-radius: 11px;
      background: linear-gradient(135deg, #C9963A, #E09030);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; color: #000; font-size: 20px;
    }
    .logo-name { font-size: 22px; font-weight: 800; color: #EDB96A; }
    .logo-sub  { font-size: 11px; color: #5A5448; }
    h1 { font-size: 24px; font-weight: 900; color: #EDB96A; margin-bottom: 6px; }
    .sub { color: #9A9080; font-size: 13px; margin-bottom: 28px; line-height: 1.6; }
    label { display: block; color: #9A9080; font-size: 12px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%; padding: 13px 16px; border-radius: 10px;
      border: 1.5px solid #1E2330; background: #0D0F13; color: #E8E2D4;
      font-size: 14px; outline: none; transition: border-color 0.2s; margin-bottom: 16px;
    }
    input:focus { border-color: #C9963A; }
    .btn {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #C9963A, #E09030);
      color: #000; font-weight: 800; font-size: 15px; cursor: pointer; margin-top: 4px;
    }
    .btn:hover { opacity: 0.88; }
    .trust { display: flex; justify-content: center; gap: 20px; margin-top: 20px; color: #5A5448; font-size: 11px; }
    .admin-link { text-align: center; margin-top: 16px; }
    .admin-link a { color: #5A5448; font-size: 11px; text-decoration: none; }
    .admin-link a:hover { color: #9A9080; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">R</div>
      <div>
        <div class="logo-name">Recouvr</div>
        <div class="logo-sub">Recouvrement B2B · Afrique de l'Ouest</div>
      </div>
    </div>

    <h1>Créer mon compte</h1>
    <p class="sub">Automatisez vos relances de factures grâce à l'IA. Rejoignez +200 entreprises en Afrique de l'Ouest.</p>

    <form method="POST" action="/">
      <label>Nom de votre entreprise</label>
      <input type="text" name="company" placeholder="ex: Groupe Bolloré CI" required/>

      <label>Votre prénom et nom</label>
      <input type="text" name="name" placeholder="ex: Aminata Koné" required/>

      <label>Adresse email professionnelle</label>
      <input type="email" name="email" placeholder="vous@entreprise.com" required/>

      <button type="submit" class="btn">Accéder à mon dashboard →</button>
    </form>

    <div class="trust">
      <span>🔒 SSL</span>
      <span>✦ IA Claude</span>
      <span>💳 Mobile Money</span>
    </div>

    <div class="admin-link">
      <a href="/admin">Accès admin →</a>
    </div>
  </div>
</body>
</html>
